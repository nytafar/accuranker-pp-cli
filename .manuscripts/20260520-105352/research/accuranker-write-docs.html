    <script id="json-schema" type="application/json">{"openapi": "3.1.0", "info": {"title": "AccuRanker Write API", "version": "v4", "description": "[Contact support](mailto:support@accuranker.com) | [Terms of Service](https://www.accuranker.com/terms/)\n# Introduction\nWelcome to the AccuRanker Write REST API. Using this API you will be able to create instances of groups, domains and keywords for your AccuRanker account.\n\n# Read API\nTo retrieve metrics about elements like keyword ranks, domains, landing pages, etc. refer to the [Read API](/api/read-docs).\n\n# Getting started\nThe first thing to get started with the AccuRanker API is to determine how you will [authenticate](/api/write-docs#section/Authentication) with the API.\nOnce your authentication method of choice has been chosen you can make your first request.\n\n# Limitations\nYour requests to this domain is limited to a burst rate (pr. minute) and continuous rate (pr. hour). These are:\n- Burst: 500/m\n- Continuous: 6000/h\n\nWhen making requests, the response header will contain information about how much of the limit has been used. Example:\n\n```\nX-Ratelimit-Limit: 500\nX-Ratelimit-Remaining: 300\nX-Ratelimit-Reset: 35\n```\n\nThe example above shows that the limit allows up to 500 requests. Two hundred requests have been used, and the limit will reset in 35 seconds.\n\nWhen a limit is reached, the endpoints will return 429 Too Many Requests. The header will include a `Retry-After` field with seconds until reset.\n    \n# Authentication\nAll requests must be authenticated using a token or OAuth.\nIf you are creating an API integration that only you will use, we recommend using token authentication - it is the easiest.\nHowever, if you are creating an integration that other users might use, we recommend using OAuth2.\n\n## Token\nYou can find your API token [here](/app/profile).\nOnce you have the token, it should be added as an `Authorization` header with the prefix `Token`.\n\n```\nAuthorization: Token YOUR_API_TOKEN\n```\n\n## OAuth\nFirst of all, you need to create an AccuRanker OAuth application [here](/oauth/applications/).\nYou can start the authentication flow when you have your app's `Client ID` and `Client Secret`.\nThe first thing you need to do is to get your `Authorization code`, or whatever means you use to authorize the app.\n\nNext, the code must to be exchanged for an `Access Token`. With a request like the example just below.\nYou may need to change the value for grant_type with a request like the example below:\n\n ```\n curl -X POST \\\n    -H \"Content-Type: application/x-www-form-urlencoded\" \\\n    \"https://app.accuranker.com/oauth/token/\" \\\n    -d \"grant_type=authorization_code\" \\\n    -d \"client_secret=YOUR_CLIENT_SECRET\" \\\n    -d \"client_id=YOUR_CLIENT_ID\" \\\n    -d \"code=YOUR_CODE\"\n ```\nIf successful the request will return access and a refresh token in the response. Like this:\n\n```\n{\n  \"access_token\": YOUR_ACCESS_TOKEN,\n  \"expires_in\": 36000,\n  \"token_type\": \"Bearer\",\n  \"scope\": \"read\",\n  \"refresh_token\": {refresh_token}\"\n}\n```\n\nThe access token should be added as an `Authorization` header with the prefix `Bearer` when you have the access token.\n```\nAuthorization: Bearer YOUR_ACCESS_TOKEN\n```\n### Refreshing the access token\nIf your Access Token has expired, you can refresh it using the Refresh Token. The request should look like this:\n\n```\n curl -X POST \\\n    -H \"Content-Type: application/x-www-form-urlencoded\" \\\n    \"https://app.accuranker.com/oauth/token/\" \\\n    -d \"grant_type=refresh_token\" \\\n    -d \"refresh_token=YOUR_REFRESH_TOKEN\"\n```\n\n### Authorization from other accounts\nTo authorise the application from other accounts, you need to generate a special authorization_code. Create a link like this:\n```\nhttps://app.accuranker.com/oauth/authorize/?client_id=YOUR_CLIENT_ID\u0026redirect_uri=YOUR_REDIRECT_URI\u0026state=YOUR_STATE\u0026response_type=code\n```\nwhere\n\n| Parameter      | Description                                        |\n| ---------------- |--------------------------------------------|\n| client_id         | The id of your application (found [here](/oauth/applications/)) |\n| redirect_uri      | The redirect URI of your application (found [here](/oauth/applications/))|\n| state             | Optional parameter that gets passed through the flow.|\n\nand give it to a user of the account you want access to.\n    "}, "paths": {"/api/v4/overview/group_domains": {"get": {"operationId": "Get group and domains", "summary": "List all your groups and their domains", "parameters": [{"in": "query", "name": "include_subaccounts", "schema": {"default": false, "description": "If true, it returns the accounts, groups, and domains for your subaccounts and your main account.", "title": "Include Subaccounts", "type": "boolean"}, "required": false, "description": "If true, it returns the accounts, groups, and domains for your subaccounts and your main account."}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/AccountClientDomain"}}}}}, "description": "This endpoint returns a list of all accounts, groups and domains for your account. The list is based on the token provided. If you are looking for account_id, group_id or domain_id use this endpoint. Curl example:\n\n    curl -X GET \\\n    -H \"Authorization: Token YOUR_API_TOKEN\" \\\n    https://app.accuranker.com/api/v4/overview/group_domains\n    ", "tags": ["Overview"], "security": [{"ApiToken": []}, {"OAuth2": []}]}}, "/api/v4/overview/keywords_for_domain/{domain_id}": {"get": {"operationId": "Get keyword for domain", "summary": "List all your keywords on the domain", "parameters": [{"in": "path", "name": "domain_id", "schema": {"description": "Id of the domain to get keywords for.", "title": "Domain Id", "type": "integer"}, "required": true, "description": "Id of the domain to get keywords for."}, {"in": "query", "name": "keyword_contains", "schema": {"description": "(Optional) Only returns keywords that contain the value (case-insensitive).", "title": "Keyword Contains", "type": "string"}, "required": false, "description": "(Optional) Only returns keywords that contain the value (case-insensitive)."}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"items": {"$ref": "#/components/schemas/KeywordOut"}, "title": "Response", "type": "array"}}}}}, "description": "This endpoint returns a list of all your keywords on the provided domain. Curl example:\n\n    curl -X GET \\\n    -H \"Authorization: Token YOUR_API_TOKEN\" \\\n    https://app.accuranker.com/api/v4/overview/keywords_for_domain/YOUR_DOMAIN_ID\\?keyword_contains=test\n    ", "tags": ["Overview"], "security": [{"ApiToken": []}, {"OAuth2": []}]}}, "/api/v4/group/": {"post": {"operationId": "Create group", "summary": "Create a new group", "parameters": [], "responses": {"201": {"description": "Created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GroupOut"}}}}}, "description": "This endpoint creates a new group on your account. The group can only be created on accounts or subaccounts authorized by the token. Curl example:\n\n    curl -X POST \\\n    -H \"Authorization: Token YOUR_API_TOKEN\" \\\n    -d \"\"{\\\"name\\\":\\\"Group name\\\",\\\"account_id\\\":YOUR_ACCOUNT_ID}\"\" \\\n    https://app.accuranker.com/api/v4/group/\n    ", "tags": ["Groups"], "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/Group"}}}, "required": true}, "security": [{"ApiToken": []}, {"OAuth2": []}]}}, "/api/v4/group/{group_id}": {"put": {"operationId": "Update group", "summary": "Update a group", "parameters": [{"in": "path", "name": "group_id", "schema": {"description": "Id of the group you want to update", "title": "Group Id", "type": "integer"}, "required": true, "description": "Id of the group you want to update"}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GroupUpdateOut"}}}}}, "description": "This endpoint updates a group for your account. Only groups on accounts or subaccounts authorized by the token can be updated.\n    All fields are optional. If you leave a field out, the value will not be updated. Curl example:\n\n    curl -X PUT \\\n    -H \"Authorization: Token YOUR_API_TOKEN\" \\\n    -d \"\"{\\\"name\\\":\\\"Group name\\\",\\\"account_id\\\":YOUR_ACCOUNT_ID}\"\" \\\n    https://app.accuranker.com/api/v4/group/YOUR_GROUP_ID\n    ", "tags": ["Groups"], "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/GroupUpdate"}}}, "required": true}, "security": [{"ApiToken": []}, {"OAuth2": []}]}, "delete": {"operationId": "Delete group", "summary": "Delete a group", "parameters": [{"in": "path", "name": "group_id", "schema": {"description": "Id of the group you want to delete", "title": "Group Id", "type": "integer"}, "required": true, "description": "Id of the group you want to delete"}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Message"}}}}}, "description": "This endpoint deletes a group and all underlying domains and keywords - hence use this endpoint with caution. Curl example:\n\n    curl -X DELETE \\\n    -H \"Authorization: Token YOUR_API_TOKEN\" \\\n    https://app.accuranker.com/api/v4/group/YOUR_GROUP_ID\n    ", "tags": ["Groups"], "security": [{"ApiToken": []}, {"OAuth2": []}]}}, "/api/v4/domain/": {"post": {"operationId": "Create domain", "summary": "Create a new domain", "parameters": [], "responses": {"201": {"description": "Created", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/DomainSchemaOut"}}}}}, "description": "This endpoint creates a new domain for your group. A domain can only be created on groups or subaccounts authorized by the token.\n    Set primary=true for a SearchSetting object you want to be primary for the domain. If the primary value is not set for any SearchSetting object,\n    the first will be assigned as primary. Curl example:\n\n    curl -X POST \\\n        -H \"Authorization: Token YOUR_API_TOKEN\" \\\n        -d \"{\\\"domain\\\":\\\"DOMAIN_URL\\\",\\\"default_searchsettings_names\\\":[{\\\"countrylocale\\\":\\\"en-GB\\\",\\\"search_engine_names\\\":[{\\\"search_engine\\\":\\\"Google\\\",\\\"search_type_names\\\":[\\\"Desktop\\\"]}],\\\"locations\\\":[\\\"Buckingham Palace, London\\\"]}],\\\"group_id\\\":YOUR_GROUP_ID}\" \\\n        https://app.accuranker.com/api/v4/domain/\n\n    ", "tags": ["Domains"], "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/DomainSchemaValidated"}}}, "required": true}, "security": [{"ApiToken": []}, {"OAuth2": []}]}}, "/api/v4/domain/{domain_id}": {"put": {"operationId": "Update domain", "summary": "Update a domain", "parameters": [{"in": "path", "name": "domain_id", "schema": {"description": "Id of the domain you want to update", "title": "Domain Id", "type": "integer"}, "required": true, "description": "Id of the domain you want to update"}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/DomainSchemaOut"}}}}}, "description": "This endpoint updates a domain in your group. All fields are optional. If you leave a field out, the value will not be updated.\n    The exception is sub-fields to default_searchsettings_names: the entire default_searchsettings_names objects will overwrite whatever exists on the domain.\n    Set primary=true for a SearchSetting object you want to be primary for the domain. If the primary value is not set for any SearchSetting object,\n    the first will be assigned as primary. Curl example:\n\n    curl -X PUT \\\n    -H \"Authorization: Token YOUR_API_TOKEN\" \\\n    -d \"{\\\"domain\\\":\\\"DOMAIN_URL\\\", \\\"display_name\\\": \\\"Domain display name\\\"}\" \\\n    https://app.accuranker.com/api/v4/domain/YOUR_DOMAIN_ID\n    ", "tags": ["Domains"], "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/DomainSchemaUpdateValidated"}}}, "required": true}, "security": [{"ApiToken": []}, {"OAuth2": []}]}, "delete": {"operationId": "Delete domain", "summary": "Delete a domain", "parameters": [{"in": "path", "name": "domain_id", "schema": {"description": "Id of the domain you want to delete", "title": "Domain Id", "type": "integer"}, "required": true, "description": "Id of the domain you want to delete"}], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Message"}}}}}, "description": "This endpoint deletes a domain and all underlying keywordss - hence use this endpoint with caution. Curl example:\n\n    curl -X DELETE \\\n    -H \"Authorization: Token YOUR_API_TOKEN\" \\\n    https://app.accuranker.com/api/v4/domain/YOUR_DOMAIN_ID\n    ", "tags": ["Domains"], "security": [{"ApiToken": []}, {"OAuth2": []}]}}, "/api/v4/keyword/": {"post": {"operationId": "Create keyword", "summary": "Create new keyword(s)", "parameters": [], "responses": {"202": {"description": "Accepted", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Message"}}}}}, "description": "With this endpoint, you can create one or more keywords on a domain. Keywords can only be created on domains authorized by the token on accounts that allow keyword exceedings.\n    Go to https://app.accuranker.com/app/account to check if it is enable.\n    If no search settings are provided, the default search settings from the domain will be used.\n    This endpoint starts a job to import your keyword(s) - If you try to add existing keywords, these will be ignored. The response header 'Location' points to a specific endpoint for monitoring the progress status of your keyword job. Curl example:\n\n    curl -X POST \\\n    -H \"Authorization: Token YOUR_API_TOKEN\" \\\n    -d \"{\\\"domain_id\\\": YOUR_DOMAIN_ID, \\\"keywords\\\":[\\\"keyword 1\\\", \\\"keyword 2\\\"]}\" \\\n    https://app.accuranker.com/api/v4/keyword/\n    ", "tags": ["Keywords"], "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/KeywordIn"}}}, "required": true}, "security": [{"ApiToken": []}, {"OAuth2": []}]}, "put": {"operationId": "Update keyword", "summary": "Update keyword(s) settings", "parameters": [], "responses": {"202": {"description": "Accepted", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Message"}}}}}, "description": "This endpoint updates settings for the given keywords. Only keywords on domains authorized by the token can be updated. Curl example:\n\n    curl -X PUT \\\n    -H \"Authorization: Token YOUR_API_TOKEN\" \\\n    -d \"{\\\"keyword_ids\\\":[YOUR_KEYWORD_IDS]}\" \\\n    https://app.accuranker.com/api/v4/keyword/\n    ", "tags": ["Keywords"], "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/KeywordSettings"}}}, "required": true}, "security": [{"ApiToken": []}, {"OAuth2": []}]}, "delete": {"operationId": "Delete keyword(s)", "summary": "Delete a keyword", "parameters": [], "responses": {"200": {"description": "OK", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Message"}}}}}, "description": "This endpoint deletes is used to delete a keyword - hence you should use this with caution. Curl example:\n\n    curl -X DELETE \\\n    -H \"Authorization: Token YOUR_API_TOKEN\" \\\n    -d \"{\\\"keyword_ids\\\":[YOUR_KEYWORD_IDS]}\" \\\n    https://app.accuranker.com/api/v4/keyword/\n    ", "tags": ["Keywords"], "requestBody": {"content": {"application/json": {"schema": {"$ref": "#/components/schemas/DeleteKeywordInput"}}}, "required": true}, "security": [{"ApiToken": []}, {"OAuth2": []}]}}, "/api/v4/status/keyword_job/{job_id}": {"get": {"operationId": "Status     <script>
        const json_encoded_schema = JSON.parse(document.getElementById("json-schema").textContent);
        Redoc.init(json_encoded_schema,
            {
              hideLoading: true,
              nativeScrollbars: true,
              noAutoAuth: true,
              hideDownloadButton: true,
              scrollYOffset: 68,
              theme: {
                spacing: {
                    sectionVertical: 20,
                },
                colors: {
                  primary: {
                    main: '#f89537',
                  },
                },
                typography: {
                  fontFamily: '"Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif',
                  headings: {
                    fontFamily: '"Open Sans", "Helvetica Neue", Helvetica, Arial, sans-serif',
                  },
                },
                rightPanel: {
                  backgroundColor: '#313445',
                },
              },
            },
            document.getElementById('redoc-container'),
            () => {
                // Select all divs whose id starts with "section"
                document.querySelectorAll('div[id^=section]').forEach((section) => {
                    // Create a class name based on the depth (e.g., "section-depth-2" for 2 slashes)
                    const depth = (section.id.match(/\//g) || []).length;  // Count the number of slashes ("/") in the id to determine the depth
                    section.classList.add(`section-depth-${depth}`);

                    // Create a class name based on the number of section children
                    const children = section.children.length;
                    section.classList.add(`section-children-${children}`);
                });

                // Select all divs whose id starts with "tag"
                document.querySelectorAll('div[id^=tag]').forEach((tag) => {
                    // Create a class name based on the depth (e.g., "tag-depth-2" for 2 slashes)
                    const depth = (tag.id.match(/\//g) || []).length;  // Count the number of slashes ("/") in the id to determine the depth
                    tag.classList.add(`tag-depth-${depth}`);

                    // Create a class name based on the number of tag children
                    const children = tag.children.length;
                    tag.classList.add(`tag-children-${children}`);
                });

                 // Select all p elements
                document.querySelectorAll('p').forEach((p) => {
                    if (!p.textContent.trim()) {
                        p.classList.add("empty")
                    }
                });
            }
        )
    </script>
